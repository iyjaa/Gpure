[package]
name = "gpure-core"
version = "0.1.0"
edition = "2024"
description = "Core utility library for the Gpure ecosystem"
license = "MIT"
authors = ["izra mulya putra guzman < izramulyaputra@gmail.com >"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
toml = { version = "0.8.20", optional = true } # Update ke 0.8.20+ untuk fix kompatibilitas
indexmap = "=2.7.1"
gpure-types = { path = "../gpure-types" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.20"
indexmap = "=2.7.1"

[features]
fs = ["dep:serde", "dep:serde_json", "dep:toml"]

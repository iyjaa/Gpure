[package]
name = "gpure-core"
version = "0.1.0"
edition = "2021"
description = "Core utility library for the Gpure ecosystem"
license = "MIT"
authors = ["izra mulya putra guzman < izramulyaputra@gmail.com >"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
toml = { version = "0.8", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[features]
fs = ["dep:serde", "dep:serde_json", "dep:toml"]
